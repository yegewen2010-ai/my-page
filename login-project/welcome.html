<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .welcome-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: bounce 1s ease-out;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        
        .welcome-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
        
        .welcome-title {
            color: #333;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            animation: slideIn 0.8s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .welcome-message {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            animation: slideIn 0.8s ease-out 0.2s both;
        }
        
        .logout-button {
            padding: 14px 32px;
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: slideIn 0.8s ease-out 0.4s both;
        }
        
        .logout-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .logout-button:active {
            transform: translateY(0);
        }
        
        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 12px;
            animation: slideIn 0.8s ease-out 0.6s both;
        }
        
        @media (max-width: 480px) {
            .welcome-container {
                padding: 40px 24px;
            }
            
            .welcome-title {
                font-size: 28px;
            }
            
            .welcome-message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>
        
        <h1 class="welcome-title">欢迎</h1>
        
        <p class="welcome-message">
            您已成功登录！<br>
            感谢您使用我们的系统。
        </p>
        
        <button class="logout-button" onclick="logout()">退出登录</button>
        
        <div class="footer">
            <p>© 2026 用户登录系统</p>
        </div>
    </div>

    <script>
        function logout() {
            // 添加淡出动画
            document.querySelector('.welcome-container').style.animation = 'fadeOut 0.5s ease-out';
            
            setTimeout(function() {
                window.location.href = 'login.html';
            }, 500);
        }
        
        // 添加淡出动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from { opacity: 1; transform: translateY(0); }
                to { opacity: 0; transform: translateY(30px); }
            }
        `;
        document.head.appendChild(style);
        
        // 自动聚焦到退出按钮
        window.onload = function() {
            document.querySelector('.logout-button').focus();
        };
    </script>
</body>
</html>
